[project]
name = "sec-earnings-bench"
version = "0.1.0"
description = "Benchmark for LLM extraction of GAAP figures from earnings releases, graded against SEC XBRL"
readme = "README.md"
authors = [
    { name = "Swaminathan Sankaran", email = "brock.swami@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.13.0",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "pandas>=3.0.6",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "secbench"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "tokenizers>=0.23.3",
]
# Stage 2 fine-tuning (secbench.train), not needed for the benchmark: uv sync --group
# train. torch and transformers are the versions vLLM 0.32.0 requires, so training
# and serving share one environment on the GPU.
train = [
    "peft==0.21.2",
    "torch==2.13.0",
    "transformers==5.19.0",
]
# vLLM, to serve the base model and adapters for scoring (secbench.score); Linux GPUs
# only, so nothing is installed on other platforms.
serve = [
    "vllm==0.32.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# llm-compressor, to quantize the merged model to 4-bit weights with AWQ for the stage 3
# serving benchmark (secbench.quantize awq). No release resolves with vLLM 0.32.0:
# vLLM pins compressed-tensors 0.17.0, and every llm-compressor that takes torch 2.13.0
# and transformers 5.19.0 pins 0.19.0 or later (0.15.0: 0.20.1). So quantize conflicts
# with serve and gets its own environment on the GPU (.venv-quantize); torch and
# transformers are pinned to train's, so the model is quantized with the library
# versions that merged it. vLLM reads the model's quantization config with its own
# compressed-tensors: QuantizationArgs and QuantizationScheme have the same fields in
# 0.17.0 and 0.20.1 (both refuse unknown fields).
quantize = [
    "llmcompressor==0.15.0",
    "torch==2.13.0",
    "transformers==5.19.0",
]
# The Hugging Face export's checks (secbench.hfexport), not needed to build it: the
# tests that load the exported dataset with datasets.load_dataset, as the Hub reads
# it, and that build the results explorer's Gradio app without starting it. CI
# installs neither, so those tests skip there (uv sync --group hf to run them).
# gradio is the version the Space pins in its own requirements.txt (space/), which a
# test checks.
hf = [
    "datasets==5.2.0",
    "gradio==6.30.0",
]

[tool.uv]
conflicts = [[{ group = "quantize" }, { group = "serve" }]]
