# Smoke test on a laptop (scripts/smoke_mac.sh): the stage 2 recipe on Qwen3-0.6B, 5
# short examples, one per step, checkpoints at steps 2, 4 and 5. Not for results.

[model]
name = "Qwen/Qwen3-0.6B"
revision = "c1899de289a04d12100db370d81485cdf75e47ca"  # main on 2026-11-01

[data]
examples = "data/stage2/labels/train.jsonl"
index = "data/stage2/labels/examples.csv"
subset = 5
max_tokens = 4096
seed = 20261101

[lora]
r = 16
alpha = 32
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[training]
epochs = 1
gradient_accumulation = 1
learning_rate = 2e-4
warmup_steps = 1
weight_decay = 0.0
max_grad_norm = 1.0
save_every = 2
gradient_checkpointing = true
dtype = "bfloat16"
device = "auto"
