name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: a test packs the repository as a git bundle, as the GPU
          # workflow does, and a bundle can't be made from a shallow clone.
          fetch-depth: 0
      - name: Install uv
        run: pipx install uv==0.13.0
      - name: Install the locked dependencies (not the GPU-only train and serve groups)
        run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (no network; the torch tests skip without the train group)
        run: uv run pytest -q
